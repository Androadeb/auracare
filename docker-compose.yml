services:
  postgres:
    container_name: postgres_cont
    image: postgres:18
    hostname: postgres
    ports:
      - "5432:5432"
    networks:
      - mynetwork
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RR1SXv231ykC2XeSN74z13Htc9
      POSTGRES_DB: SkinCare
    volumes:
      - postgres-db:/var/lib/postgresql
    restart: unless-stopped
  abpapp:
    build:
      context: .
      dockerfile: src/Alexapps.SkinCare.HttpApi.Host/Dockerfile
    container_name: abpapp
    ports:
      - "8080:8080" 
    depends_on:
      - postgres
      - db-migrator
    networks:
      - mynetwork
    volumes:
      - uploads-data:/app/wwwroot/uploads:rw
  db-migrator:
    build:
      context: .
      dockerfile: src/Alexapps.SkinCare.DbMigrator/Dockerfile
    volumes:
      - ./src/Alexapps.SkinCare.DbMigrator/appsettings.json:/app/appsettings.json:ro
    depends_on:
      - postgres
    networks:
      - mynetwork
  doctor-dashboard:
    build:
      context: .
      dockerfile: src/Alexapps.SkinCare.Blazor.DoctorDashboard/Dockerfile
    container_name: doctor-dashboard
    ports:
      - "8081:8080"
    depends_on:
      - abpapp
    networks:
      - mynetwork
  lab-blazor:
    build:
      context: .
      dockerfile: src/Alexapps.SkinCare.Lab/Dockerfile
    container_name: lab-blazor
    ports:
      - "8082:8080"
    depends_on:
      - abpapp
    networks:
      - mynetwork
volumes:
  postgres-db:
  uploads-data:     
networks:
  mynetwork:
    driver: bridge


